<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="45%" stop-color="#004aad"/>
      <stop offset="85%" stop-color="#002b66"/>
      <stop offset="100%" stop-color="#001233"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#004aad" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#001845" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.3)"/>
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGradient)"/>
  <rect width="1200" height="420" fill="url(#cyberGrid)"/>

  <!-- Radial Atmosphere Glows -->
  <circle cx="600" cy="180" r="350" fill="url(#centerGlow)"/>
  <circle cx="200" cy="80" r="220" fill="url(#goldGlow)"/>
  <circle cx="1050" cy="340" r="260" fill="url(#centerGlow)"/>

  <!-- Abstract Tech / Cyber Constellation Lines -->
  <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2" fill="none">
    <path d="M 100 120 L 220 80 L 340 140 L 480 90"/>
    <path d="M 720 90 L 860 140 L 980 80 L 1100 120"/>
    <path d="M 150 320 L 280 280 L 420 330"/>
    <path d="M 780 330 L 920 280 L 1050 320"/>
  </g>

  <!-- Constellation Star Nodes -->
  <g fill="#38bdf8">
    <circle cx="100" cy="120" r="3" opacity="0.8"/>
    <circle cx="220" cy="80" r="4" opacity="0.9"/>
    <circle cx="340" cy="140" r="3" opacity="0.7"/>
    <circle cx="480" cy="90" r="3.5" opacity="0.85"/>
    <circle cx="720" cy="90" r="3.5" opacity="0.85"/>
    <circle cx="860" cy="140" r="3" opacity="0.7"/>
    <circle cx="980" cy="80" r="4" opacity="0.9"/>
    <circle cx="1100" cy="120" r="3" opacity="0.8"/>
  </g>

  <g fill="#fbbf24">
    <circle cx="220" cy="80" r="2"/>
    <circle cx="980" cy="80" r="2"/>
    <circle cx="280" cy="280" r="2.5" opacity="0.8"/>
    <circle cx="920" cy="280" r="2.5" opacity="0.8"/>
  </g>

  <!-- Top Badge: Achievement & Chapter Malang -->
  <g transform="translate(600, 68)" text-anchor="middle">
    <!-- Badge Background -->
    <rect x="-240" y="-18" width="480" height="36" rx="18" fill="url(#badgeGradient)" stroke="rgba(251, 191, 36, 0.4)" stroke-width="1.2"/>
    <!-- Badge Text -->
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#fde68a">
      EXPLOR[AI]TION CHAPTER MALANG 2026 &bull; JUARA 2
    </text>
  </g>

  <!-- Central Title: ANGKASA -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <!-- Backing Glow for Title -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="82" font-weight="900" letter-spacing="14" fill="#0284c7" filter="url(#glowEffect)" opacity="0.4">
      ANGKASA
    </text>
    <!-- Crisp Foreground Title -->
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="82" font-weight="900" letter-spacing="14" fill="#ffffff">
      ANGKASA
    </text>
  </g>

  <!-- Subtitle: AI-Powered Verified Opportunity & Team Aggregator -->
  <g transform="translate(600, 238)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="url(#goldGradient)">
      AI-Powered Verified Opportunity &amp; Team Aggregator
    </text>
  </g>

  <!-- Description / Sub-tagline -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0.8" fill="rgba(255, 255, 255, 0.75)">
      Navigasi Karir Cerdas &bull; Kurasi Peluang Anti-Hoaks &bull; Bursa Kolaborasi Talenta Mahasiswa
    </text>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(600, 345)" text-anchor="middle">
    <!-- Pill 1: AI Career Insight -->
    <g transform="translate(-290, 0)">
      <rect x="-120" y="-16" width="240" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#e0f2fe">
        AI CAREER INSIGHT
      </text>
    </g>

    <!-- Pill 2: Curated Feed & Roadmap -->
    <g transform="translate(0, 0)">
      <rect x="-130" y="-16" width="260" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#fde68a">
        VERIFIED CURATED FEED
      </text>
    </g>

    <!-- Pill 3: Team Collaboration -->
    <g transform="translate(290, 0)">
      <rect x="-120" y="-16" width="240" height="32" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1" fill="#e0f2fe">
        TEAM FINDER &amp; COLLAB
      </text>
    </g>
  </g>

  <!-- Decorative Corner Brackets -->
  <g stroke="rgba(251, 191, 36, 0.5)" stroke-width="2" fill="none">
    <path d="M 30 50 L 30 30 L 50 30"/>
    <path d="M 1170 50 L 1170 30 L 1150 30"/>
    <path d="M 30 370 L 30 390 L 50 390"/>
    <path d="M 1170 370 L 1170 390 L 1150 390"/>
  </g>
</svg>