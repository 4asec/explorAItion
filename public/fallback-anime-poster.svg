<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="fallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001845"/>
      <stop offset="50%" stop-color="#004aad"/>
      <stop offset="100%" stop-color="#001233"/>
    </linearGradient>

    <linearGradient id="fallGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#001845" stop-opacity="0"/>
    </radialGradient>

    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#fallBg)"/>
  <rect width="800" height="450" fill="url(#gridPattern)"/>

  <!-- Celestial Cyber Orbit Rings -->
  <g fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5">
    <ellipse cx="400" cy="225" rx="260" ry="90" transform="rotate(-18 400 225)"/>
    <ellipse cx="400" cy="225" rx="310" ry="110" transform="rotate(25 400 225)" stroke="rgba(251, 191, 36, 0.2)"/>
  </g>

  <!-- Central Glow -->
  <circle cx="400" cy="225" r="180" fill="url(#neonGlow)"/>

  <!-- Anime Aesthetic Stylized Starfield -->
  <g fill="#ffffff" opacity="0.65">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="210" cy="140" r="2"/>
    <circle cx="160" cy="310" r="1.5"/>
    <circle cx="290" cy="380" r="2"/>
    <circle cx="680" cy="90" r="2"/>
    <circle cx="720" cy="280" r="1.5"/>
    <circle cx="610" cy="360" r="2"/>
    <polygon points="400,105 404,115 414,119 404,123 400,133 396,123 386,119 396,115" fill="#fde68a" opacity="0.9"/>
  </g>

  <!-- Stylized Cyber Character Silhouette / Crest -->
  <g transform="translate(400, 205)" text-anchor="middle">
    <!-- Outer Shield / Hexagon -->
    <polygon points="0,-65 56,-32 56,32 0,65 -56,32 -56,-32" fill="rgba(0, 43, 102, 0.6)" stroke="rgba(251, 191, 36, 0.6)" stroke-width="2"/>
    <!-- Cyber Core Icon -->
    <circle cx="0" cy="0" r="24" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="0,-12 10,8 -10,8" fill="#fbbf24"/>
  </g>

  <!-- Typography -->
  <g transform="translate(400, 310)" text-anchor="middle">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#ffffff">
      ANGKASA
    </text>
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="url(#fallGold)">
      OFFICIAL OPPORTUNITY POSTER
    </text>
  </g>
</svg>